<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background with gradient effect -->
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="256" height="256" fill="url(#gradBg)" rx="56"/>
  
  <!-- Code brackets: < -->
  <path d="M 85 100 L 115 128 L 85 156" stroke="white" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Code brackets: / and \ -->
  <line x1="128" y1="85" x2="128" y2="171" stroke="white" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Code brackets: > -->
  <path d="M 171 100 L 141 128 L 171 156" stroke="white" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
